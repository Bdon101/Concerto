<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <style>
    auth-provider { display: contents; }
    body { min-height: 100vh; }
    .auth-page {
      max-width: 480px;
      margin: var(--space-5) auto;
      padding: 0 var(--space-3);
    }
    .auth-page h1 {
      margin-bottom: var(--space-3);
    }
    .auth-page label {
      display: grid;
      gap: var(--space-1);
    }
    .auth-page input {
      padding: var(--space-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      background: var(--color-background-page);
      color: var(--color-text);
      font: inherit;
    }
  </style>
</head>
<body>
  <auth-provider>
    <main class="auth-page">
      <div class="card">
        <h1>Sign in</h1>
        <login-form api="/auth/login">
          <label>
            <span>Username</span>
            <input name="username" autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" />
          </label>
        </login-form>
        <p>Need an account? <a href="/register.html">Register</a></p>
      </div>
    </main>
  </auth-provider>
  <script type="module" src="/src/login.ts"></script>
</body>
</html>
