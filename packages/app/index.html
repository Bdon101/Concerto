<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <style>
    /* unbndl providers wrap content but shouldn't break body layout.
       layout.css makes body a 2-row grid that assumes <header> and
       <main> are direct children of <body>; in the SPA they're nested
       inside <history-provider> / <auth-provider> / <store-provider>.
       Override body back to normal block flow so the header sizes to
       its own content. */
    body {
      display: block;
      min-height: 100vh;
      background-color: var(--color-background-page);
    }
    history-provider,
    auth-provider,
    store-provider {
      display: contents;
    }
    .site-header {
      padding: var(--space-2) var(--space-5);
      align-items: center;
    }
    .site-brand {
      gap: 0;
    }
    .site-name {
      font-size: 1.5rem;
    }
    .site-tagline {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .site-header-meta {
      align-items: end;
      justify-items: end;
    }
    @media (max-width: 900px) {
      .site-header {
        padding: var(--space-2) var(--space-4);
        gap: var(--space-1);
      }
    }
  </style>
</head>
<body>
  <history-provider>
    <auth-provider redirect="/login.html">
      <store-provider>
        <header class="site-header">
          <div class="site-brand">
            <a class="site-name" href="/app">Concerto</a>
            <p class="site-tagline">Concert memory tracker</p>
          </div>
          <div class="site-header-meta">
            <concerto-auth-status></concerto-auth-status>
          </div>
        </header>
        <main class="page-grid">
          <section class="page-main">
            <router-switch></router-switch>
          </section>
          <aside class="page-side">
            <section class="card">
              <h2>Artists</h2>
              <ul class="stack-list">
                <li><a href="/app/artists/aespa">aespa</a></li>
                <li><a href="/app/artists/grent-perez">Grent Perez</a></li>
              </ul>
            </section>
            <section class="card">
              <h2>Venues</h2>
              <ul class="stack-list">
                <li><a href="/app/venues/kia-forum">Kia Forum</a></li>
                <li><a href="/app/venues/fonda-theater">Fonda Theater</a></li>
              </ul>
            </section>
            <section class="card">
              <h2>Setlists</h2>
              <ul class="stack-list">
                <li><a href="/app/shows/aespa-kia-forum-2025/setlist">aespa @ Kia Forum</a></li>
                <li><a href="/app/shows/grent-perez-fonda-2023/setlist">Grent Perez @ Fonda</a></li>
              </ul>
            </section>
            <section class="card">
              <h2>Memories</h2>
              <ul class="stack-list">
                <li><a href="/app/shows/aespa-kia-forum-2025/memory">aespa @ Kia Forum</a></li>
                <li><a href="/app/shows/grent-perez-fonda-2023/memory">Grent Perez @ Fonda</a></li>
              </ul>
            </section>
          </aside>
        </main>
      </store-provider>
    </auth-provider>
  </history-provider>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
