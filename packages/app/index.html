<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <style>
    /* unbndl providers wrap content but shouldn't break body layout.
       layout.css makes body a 2-row grid that assumes <header> and
       <main> are direct children of <body>; in the SPA they're nested
       inside <history-provider> / <auth-provider> / <store-provider>.
       Override body back to normal block flow so the header sizes to
       its own content. */
    body {
      display: block;
      min-height: 100vh;
      background-color: var(--color-background-page);
    }
    history-provider,
    auth-provider,
    store-provider {
      display: contents;
    }
    .site-header {
      padding: var(--space-2) var(--space-5);
      align-items: center;
    }
    .site-brand {
      gap: 0;
    }
    .site-name {
      font-size: 1.5rem;
    }
    .site-header-meta {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    /* Dark-mode switch */
    .dark-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      cursor: pointer;
      color: var(--color-text-inverted);
    }
    .dark-toggle-icon {
      font-size: 0.95rem;
      line-height: 1;
    }
    .dark-toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .dark-toggle-track {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: rgba(248, 242, 232, 0.28);
      transition: background 0.2s ease;
    }
    .dark-toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--color-text-inverted);
      transition: transform 0.2s ease;
    }
    .dark-toggle input:checked + .dark-toggle-track {
      background: var(--color-accent);
    }
    .dark-toggle input:checked + .dark-toggle-track .dark-toggle-thumb {
      transform: translateX(18px);
    }
    .dark-toggle input:focus-visible + .dark-toggle-track {
      outline: 2px solid var(--color-text-inverted);
      outline-offset: 2px;
    }
    /* Visually-hidden label text (kept for screen readers) */
    .dark-toggle-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .page-content {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: var(--space-5) var(--space-4);
    }
    @media (max-width: 900px) {
      .site-header {
        padding: var(--space-2) var(--space-4);
        gap: var(--space-1);
      }
      .page-content {
        padding: var(--space-4) var(--space-3);
      }
    }
  </style>
</head>
<body>
  <script>
    // Apply the saved (or system) dark-mode preference before paint to
    // avoid a flash. The toggle wiring lives in /scripts/dark-mode.js.
    (function () {
      try {
        var stored = localStorage.getItem("concerto:dark-mode");
        var on = stored === null
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : stored === "true";
        if (on) document.body.classList.add("dark-mode");
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
  <history-provider>
    <auth-provider redirect="/login.html">
      <store-provider>
        <header class="site-header">
          <div class="site-brand">
            <a class="site-name" href="/app">Concerto</a>
          </div>
          <div class="site-header-meta">
            <label class="dark-toggle" title="Toggle dark mode">
              <span class="dark-toggle-icon" aria-hidden="true">☾</span>
              <input type="checkbox" data-dark-toggle autocomplete="off" />
              <span class="dark-toggle-track" aria-hidden="true">
                <span class="dark-toggle-thumb"></span>
              </span>
              <span class="dark-toggle-label">Dark mode</span>
            </label>
            <concerto-auth-status></concerto-auth-status>
          </div>
        </header>
        <main>
          <div class="page-content">
            <router-switch></router-switch>
          </div>
        </main>
      </store-provider>
    </auth-provider>
  </history-provider>
  <script src="/scripts/dark-mode.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
