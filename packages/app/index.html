<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <style>
    /* unbndl providers wrap content but shouldn't break body layout.
       layout.css makes body a 2-row grid that assumes <header> and
       <main> are direct children of <body>; in the SPA they're nested
       inside <history-provider> / <auth-provider> / <store-provider>.
       Override body back to normal block flow so the header sizes to
       its own content. */
    body {
      display: block;
      min-height: 100vh;
      background-color: var(--color-background-page);
    }
    history-provider,
    auth-provider,
    store-provider {
      display: contents;
    }
    .site-header {
      padding: var(--space-2) var(--space-5);
      align-items: center;
    }
    .site-brand {
      gap: 0;
    }
    .site-name {
      font-size: 1.5rem;
    }
    .site-header-meta {
      align-items: end;
      justify-items: end;
    }
    .page-content {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: var(--space-5) var(--space-4);
    }
    @media (max-width: 900px) {
      .site-header {
        padding: var(--space-2) var(--space-4);
        gap: var(--space-1);
      }
      .page-content {
        padding: var(--space-4) var(--space-3);
      }
    }
  </style>
</head>
<body>
  <history-provider>
    <auth-provider redirect="/login.html">
      <store-provider>
        <header class="site-header">
          <div class="site-brand">
            <a class="site-name" href="/app">Concerto</a>
          </div>
          <div class="site-header-meta">
            <concerto-auth-status></concerto-auth-status>
          </div>
        </header>
        <main>
          <div class="page-content">
            <router-switch></router-switch>
          </div>
        </main>
      </store-provider>
    </auth-provider>
  </history-provider>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
