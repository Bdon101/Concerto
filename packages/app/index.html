<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <style>
    /* unbndl providers wrap content but shouldn't break the body grid */
    history-provider,
    auth-provider,
    store-provider {
      display: contents;
    }
    .site-header {
      padding: var(--space-2) var(--space-5);
    }
    .site-brand {
      gap: 0;
    }
    .site-name {
      font-size: 1.5rem;
    }
    .site-tagline {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .site-header-meta {
      align-items: end;
      justify-items: end;
    }
    @media (max-width: 900px) {
      .site-header {
        padding: var(--space-2) var(--space-4);
        gap: var(--space-1);
      }
    }
  </style>
</head>
<body>
  <history-provider>
    <auth-provider redirect="/login.html">
      <store-provider>
        <header class="site-header">
          <div class="site-brand">
            <a class="site-name" href="/app">Concerto</a>
            <p class="site-tagline">Concert memory tracker</p>
          </div>
          <div class="site-header-meta">
            <concerto-auth-status></concerto-auth-status>
          </div>
        </header>
        <main class="page-grid">
          <section class="page-main">
            <router-switch></router-switch>
          </section>
        </main>
      </store-provider>
    </auth-provider>
  </history-provider>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
