<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concerto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <script type="module" src="/scripts/dark-mode.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@unbndl/html": "https://unpkg.com/@unbndl/html"
    }
  }
  </script>
  <script type="module">
    import { define } from "@unbndl/html";
    import { ShowCardElement } from "/js/show-card.js";
    import { ShowListElement } from "/js/show-list.js";

    define({
      "concerto-show-card": ShowCardElement,
      "concerto-show-list": ShowListElement
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <a class="site-name" href="/index.html">Concerto</a>
      <p class="site-tagline">Concert memory tracker</p>
    </div>
    <div class="site-header-meta">
      <p class="page-tag">Archive</p>
      <nav class="site-nav">
        <a href="/index.html">All shows</a>
      </nav>
      <label class="mode-toggle" data-darkmode-toggle>
        <input type="checkbox" autocomplete="off">
        Dark mode
      </label>
    </div>
  </header>

  <main class="page-grid">
    <section class="page-main">
      <section class="card">
        <h1>Concert Archive</h1>
        <p>A scrapbook of concerts I have attended.</p>
      </section>

      <section class="card">
        <h2>Shows</h2>
        <concerto-show-list src="/data/shows.json"></concerto-show-list>
      </section>
    </section>

    <aside class="page-side">
      <section class="card">
        <h2>Scrapbook Notes</h2>
        <p>Theme: moody vintage scrapbook.</p>
        <p>Saved shows: 2</p>
      </section>

      <section class="card">
        <h2>Browse Details</h2>
        <ul class="stack-list">
          <li><a href="/artists/grent-perez.html">Grent Perez</a></li>
          <li><a href="/artists/aespa.html">aespa</a></li>
          <li><a href="/venues/fonda-theater.html">Fonda Theater</a></li>
          <li><a href="/venues/kia-forum.html">Kia Forum</a></li>
        </ul>
      </section>
    </aside>
  </main>
</body>
</html>
